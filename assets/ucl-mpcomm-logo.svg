<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="UCL-MPComm - Unified Communication Library, Memory Pool Communication - Tencent Astral Network Team">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F7FBFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <radialGradient id="haloL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="plate1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="52%" stop-color="#38A0F0"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="plate2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93D4FB"/>
      <stop offset="55%" stop-color="#2E7FE8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="plate3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="55%" stop-color="#4F5FE0"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.65">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="30%" stop-color="#1E7BE8"/>
      <stop offset="66%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D7BE8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2E9BF0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0B5ED0" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2E9BF0" flood-opacity="0.45"/>
    </filter>
    <filter id="glowM" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#3B82F6" flood-opacity="0.5"/>
    </filter>
    <filter id="textShadow" x="-30%" y="-40%" width="170%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1D4ED8" flood-opacity="0.28"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1D7BE8" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1120" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1120" height="300" rx="22" fill="url(#grid)"/>
  <ellipse cx="190" cy="150" rx="290" ry="215" fill="url(#haloL)"/>
  <ellipse cx="880" cy="120" rx="330" ry="200" fill="url(#haloR)"/>
  <rect x="1" y="1" width="1118" height="298" rx="22" fill="none" stroke="#BFDBFE" stroke-width="2"/>

  <!-- star field (Astral) -->
  <g fill="#2563EB">
    <circle cx="512" cy="42" r="2.1" opacity="0.75"/>
    <circle cx="596" cy="72" r="1.4" opacity="0.45"/>
    <circle cx="700" cy="34" r="1.8" opacity="0.6"/>
    <circle cx="812" cy="60" r="1.3" opacity="0.4"/>
    <circle cx="928" cy="38" r="2.3" opacity="0.7"/>
    <circle cx="1010" cy="86" r="1.5" opacity="0.45"/>
    <circle cx="1058" cy="196" r="1.9" opacity="0.5"/>
    <circle cx="972" cy="252" r="1.4" opacity="0.4"/>
    <circle cx="404" cy="264" r="1.6" opacity="0.45"/>
    <circle cx="300" cy="56" r="1.4" opacity="0.4"/>
  </g>
  <g stroke="#2E9BF0" stroke-width="1" stroke-opacity="0.35" fill="none">
    <path d="M512 42 L596 72 L700 34 L812 60 L928 38"/>
    <path d="M928 38 L1010 86 L1058 196"/>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#1D7BE8" stroke-width="2.4" stroke-opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M26 62 V36 H52"/>
    <path d="M1094 62 V36 H1068"/>
    <path d="M26 238 V264 H52"/>
    <path d="M1094 238 V264 H1068"/>
  </g>

  <!-- icon: isometric memory pool + multi-rail lanes -->
  <g transform="translate(168,150)">
    <line x1="0" y1="-118" x2="0" y2="118" stroke="#2E9BF0" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="5 7"/>

    <g filter="url(#glowS)">
      <path d="M0 -38 L86 6 L0 50 L-86 6 Z" fill="url(#plate3)" stroke="#312E81" stroke-width="2" stroke-opacity="0.75"/>
    </g>
    <g filter="url(#glowS)">
      <path d="M0 -92 L86 -48 L0 -4 L-86 -48 Z" fill="url(#plate2)" stroke="#1E3A8A" stroke-width="2" stroke-opacity="0.8"/>
    </g>
    <g filter="url(#glowM)">
      <path d="M0 -146 L86 -102 L0 -58 L-86 -102 Z" fill="url(#plate1)" stroke="#0B5ED0" stroke-width="2.2"/>
    </g>

    <g fill="#FFFFFF" fill-opacity="0.82" stroke="#0B5ED0" stroke-width="1.2" stroke-opacity="0.7">
      <path d="M-30 -110 L-8 -99 L-30 -88 L-52 -99 Z"/>
      <path d="M12 -117 L34 -106 L12 -95 L-10 -106 Z"/>
      <path d="M-8 -95 L14 -84 L-8 -73 L-30 -84 Z"/>
    </g>

    <g stroke="#0B5ED0" stroke-width="1.8" fill="#38BDF8" fill-opacity="0.5">
      <path d="M104 -128 L120 -120 L104 -112 L88 -120 Z"/>
      <path d="M132 -152 L145 -145.5 L132 -139 L119 -145.5 Z" fill-opacity="0.3"/>
      <path d="M-104 62 L-88 70 L-104 78 L-120 70 Z" fill-opacity="0.35"/>
    </g>

    <g stroke-linecap="round">
      <line x1="66" y1="86" x2="150" y2="86" stroke="url(#rail)" stroke-width="4"/>
      <line x1="52" y1="102" x2="150" y2="102" stroke="url(#rail)" stroke-width="4"/>
      <line x1="66" y1="118" x2="150" y2="118" stroke="url(#rail)" stroke-width="4"/>
      <line x1="86" y1="134" x2="150" y2="134" stroke="url(#rail)" stroke-width="4"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI,Helvetica Neue,Arial,DejaVu Sans,sans-serif">
    <text x="352" y="146" font-size="96" font-weight="700" textLength="620" lengthAdjust="spacingAndGlyphs" fill="url(#word)" filter="url(#textShadow)">UCL-MPComm</text>
    <rect x="354" y="172" width="616" height="2" rx="1" fill="url(#rule)"/>
    <text x="356" y="209" font-size="23" font-weight="600" textLength="600" lengthAdjust="spacingAndGlyphs" fill="#1D4ED8">Unified Communication Library — Memory Pool Communication</text>
    <text x="356" y="250" font-size="18" font-weight="600" textLength="470" lengthAdjust="spacingAndGlyphs" fill="#2E7FE8">TENCENT ASTRAL NETWORK TEAM</text>
  </g>
</svg>
