<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0E2036"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="url(#bgGrad4)"/>

  <!-- Top caption + brand tag -->
  <text x="60" y="55" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#9FB3C8">Sustained bandwidth as context grows</text>
  <text x="1140" y="50" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#5B94A8">CREDO</text>

  <!-- Y-axis title -->
  <text x="220" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#9FB3C8">bandwidth, normalized (log scale)</text>

  <!-- Spill bands -->
  <rect x="670" y="185" width="150" height="385" fill="#1B4A48" opacity="0.35"/>
  <rect x="910" y="185" width="150" height="385" fill="#1B4A48" opacity="0.35"/>
  <text x="745" y="160" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9FB3C8">working set spills to</text>
  <text x="745" y="177" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9FB3C8">CPU LPDDR</text>
  <text x="985" y="160" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9FB3C8">spills again to CXL</text>

  <!-- Gridlines -->
  <g stroke="#2E4B5E" stroke-width="1" stroke-dasharray="4,4" opacity="0.6">
    <line x1="220" y1="200" x2="1140" y2="200"/>
    <line x1="220" y1="344" x2="1140" y2="344"/>
    <line x1="220" y1="488" x2="1140" y2="488"/>
  </g>

  <!-- Axis lines -->
  <g stroke="#3E5C76" stroke-width="1.5">
    <line x1="220" y1="180" x2="220" y2="570"/>
    <line x1="220" y1="570" x2="1140" y2="570"/>
  </g>

  <!-- Y tick labels -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9FB3C8" text-anchor="end">
    <text x="205" y="205">1x</text>
    <text x="205" y="349">0.1x</text>
    <text x="205" y="493">0.01x</text>
  </g>

  <!-- X tick labels -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#9FB3C8" text-anchor="middle">
    <text x="220" y="600">1K</text>
    <text x="450" y="600">10K</text>
    <text x="680" y="600">100K</text>
    <text x="910" y="600">1M</text>
    <text x="1140" y="600">10M</text>
  </g>
  <text x="680" y="638" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#9FB3C8">Context length (tokens, log scale)</text>

  <!-- Tiered line (drops twice) -->
  <path d="M220,200 L450,200 L644,200 L698,243 L749,301 L805,338 L841,344 L881,344 L910,347 L936,387 L979,445 L1035,488 L1089,520 L1140,554" fill="none" stroke="#C7D6E6" stroke-width="2.5" stroke-dasharray="1,5" stroke-linecap="round"/>

  <!-- Weaver line (flat) -->
  <path d="M220,201 L1140,196" fill="none" stroke="#35D8C4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Line labels -->
  <text x="240" y="182" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#35D8C4">Weaver &#8212; nothing to spill into</text>
  <text x="240" y="224" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#EAF2FB">Tiered &#8212; while it fits in HBM</text>
  <text x="240" y="246" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-style="italic" fill="#9FB3C8">parity at short context</text>

  <!-- Slowdown callouts -->
  <text x="860" y="388" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4FAFF">10x slower</text>
  <text x="1000" y="575" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#F4FAFF">100x slower</text>

  <text x="1140" y="690" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9FB3C8" opacity="0.8">Illustration based on Credo's AI Infra Summit 2026 presentation</text>
</svg>
